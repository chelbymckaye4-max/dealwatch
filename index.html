<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dealwatch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#ecebe8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dealwatch">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ecebe8; --tile: #e0deda; --card: #f6f5f2; --ink: #1f1f1e; --muted: #8b8a86; --line: #d9d7d2;
    --dark: #1c1c1b; --on-dark: #ffffff; --off-bg: #f4d5cc; --off-ink: #b8452f; --ok-bg: #2f5d4a; --ok-ink: #ffffff;
    --heart: #e5484d; --bar: rgba(246,245,242,.9);
    box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121211; --tile: #232321; --card: #1b1b1a; --ink: #f3f2ef; --muted: #9a9995; --line: #2c2c2a;
      --dark: #f3f2ef; --on-dark: #121211; --off-bg: #4a2a22; --off-ink: #f2a595; --ok-bg: #3d7a62; --ok-ink: #ffffff;
      --heart: #ff6b70; --bar: rgba(27,27,26,.9);
    }
  }
  :root[data-theme="dark"] {
    --bg: #121211; --tile: #232321; --card: #1b1b1a; --ink: #f3f2ef; --muted: #9a9995; --line: #2c2c2a;
    --dark: #f3f2ef; --on-dark: #121211; --off-bg: #4a2a22; --off-ink: #f2a595; --ok-bg: #3d7a62; --ok-ink: #ffffff;
    --heart: #ff6b70; --bar: rgba(27,27,26,.9);
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.35; -webkit-font-smoothing: antialiased; }
  main { max-width: 640px; margin: 0 auto; padding: 14px 16px calc(112px + env(safe-area-inset-bottom, 0px)); }
  button, a { -webkit-tap-highlight-color: transparent; font-family: inherit; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #banner:not(:empty) { background: var(--dark); color: var(--on-dark); font-weight: 600; font-size: 13px; text-align: center; padding: 6px 12px; }
  .svgi { display: inline-grid; place-items: center; }
  .svgi svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .svgi.on svg { fill: currentColor; }

  /* header */
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .head .brand { font-size: 26px; font-weight: 600; letter-spacing: -0.03em; }
  .head .l, .head .r { display: flex; align-items: center; gap: 10px; }
  .head .l { flex: 1; }
  .head .r { justify-content: flex-end; }
  .ib { border: 0; background: none; color: var(--ink); padding: 6px; cursor: pointer; text-decoration: none; display: inline-grid; place-items: center; position: relative; }
  .circ { width: 44px; height: 44px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.08); border: 0; color: var(--ink); display: inline-grid; place-items: center; cursor: pointer; text-decoration: none; }
  .circ.on { color: var(--heart); }
  .sub { color: var(--muted); font-size: 13px; font-weight: 500; margin: -6px 0 14px; }
  .ptitle { font-size: 30px; font-weight: 600; letter-spacing: -0.03em; margin: 4px 0 4px; line-height: 1.1; }
  .psub { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .pbar { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }

  /* sections */
  .sh { display: flex; align-items: baseline; justify-content: space-between; margin: 26px 0 12px; }
  .sh h3 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
  .sh a { color: var(--muted); font-size: 14px; font-weight: 500; text-decoration: none; }

  /* banner carousel */
  .bn-wrap { position: relative; }
  .bn-track { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; scroll-padding: 0 16px; }
  .bn-track::-webkit-scrollbar { display: none; }
  .bn { flex: none; width: 100%; scroll-snap-align: center; position: relative; min-height: 204px; border-radius: 26px; background: var(--tile); overflow: hidden; padding: 20px; display: flex; align-items: center; color: inherit; text-decoration: none; }
  .bn .txt { position: relative; z-index: 1; width: 58%; }
  .bn .kick { font-size: 13px; color: var(--muted); font-weight: 600; }
  .bn h2 { margin: 4px 0 6px; font-size: 21px; line-height: 1.15; font-weight: 600; letter-spacing: -0.02em; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .bn .pr { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  .bn .bi { position: absolute; right: 0; top: 0; bottom: 0; width: 52%; display: grid; place-items: center; color: var(--muted); }
  .bn .bi img { width: 100%; height: 100%; object-fit: cover; -webkit-mask-image: linear-gradient(to right, transparent, #000 38%); mask-image: linear-gradient(to right, transparent, #000 38%); }
  .bn .bi .svgi svg { width: 64px; height: 64px; opacity: .5; }
  .dots { position: absolute; left: 20px; bottom: 14px; display: flex; gap: 6px; z-index: 2; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(120,120,115,.4); }
  .dots i.on { background: var(--ink); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; background: var(--dark); color: var(--on-dark); font: inherit; font-size: 14px; font-weight: 600; padding: 11px 18px; border-radius: 999px; cursor: pointer; text-decoration: none; }
  .btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
  .btn.block { width: 100%; padding: 15px 18px; font-size: 15px; }

  /* category row */
  .cats { display: flex; gap: 14px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 4px; scrollbar-width: none; }
  .cats::-webkit-scrollbar { display: none; }
  a.ct { flex: none; width: 80px; text-align: center; text-decoration: none; color: inherit; }
  .ct .ci, .bg .ci { background: var(--tile); border-radius: 18px; display: grid; place-items: center; overflow: hidden; color: var(--muted); }
  .ct .ci { width: 80px; height: 80px; }
  .ct .ci img, .bg .ci img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ct .nm { font-size: 12px; font-weight: 500; margin-top: 7px; line-height: 1.2; }
  .ct.zero, .bg.zero { opacity: .55; }

  /* product grid */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pc { position: relative; background: var(--card); border-radius: 22px; overflow: hidden; }
  .pc > a { display: block; color: inherit; text-decoration: none; }
  .pc-img { position: relative; aspect-ratio: 1 / 0.92; background: var(--tile); display: grid; place-items: center; color: var(--muted); }
  .pc-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pc-img .svgi svg { width: 44px; height: 44px; opacity: .55; }
  .badges { position: absolute; left: 10px; top: 10px; display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
  .pill { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; line-height: 1.3; }
  .pill.off { background: var(--off-bg); color: var(--off-ink); }
  .pill.ok { background: var(--ok-bg); color: var(--ok-ink); }
  .pill.warn { background: var(--tile); color: var(--muted); }
  .pc .heart { position: absolute; right: 8px; top: 8px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(255,255,255,.78); color: #3a3a38; display: grid; place-items: center; cursor: pointer; }
  .pc .heart.on { color: var(--heart); }
  .pc .heart .svgi svg { width: 19px; height: 19px; }
  .pc-b { padding: 10px 12px 14px; }
  .pc-b .nm { font-size: 14px; font-weight: 500; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 35px; }
  .pc-b .pr { margin-top: 6px; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .pc-b .pr s { color: var(--muted); font-size: 13px; font-weight: 500; margin-left: 6px; }
  .pc-b .mt { margin-top: 3px; color: var(--muted); font-size: 12px; font-weight: 500; }

  /* chips */
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 4px -16px 14px; padding: 0 16px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  a.chip { flex: none; background: var(--card); color: var(--ink); font-size: 14px; font-weight: 500; padding: 8px 15px; border-radius: 999px; text-decoration: none; white-space: nowrap; }
  a.chip[aria-current="true"] { background: var(--dark); color: var(--on-dark); }
  a.chip.zero { color: var(--muted); }

  /* browse tiles */
  .bgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  a.bg { display: block; color: inherit; text-decoration: none; background: var(--card); border-radius: 22px; padding: 10px 10px 14px; }
  .bg .ci { width: 100%; aspect-ratio: 1 / .78; border-radius: 16px; }
  .bg .nm { font-size: 15px; font-weight: 600; margin: 10px 4px 0; letter-spacing: -0.01em; }
  .bg .ct2 { font-size: 12.5px; color: var(--muted); margin: 2px 4px 0; font-weight: 500; }
  .ci .svgi svg { width: 34px; height: 34px; opacity: .6; }

  /* search */
  .sbox { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 999px; padding: 0 16px; height: 48px; flex: 1; }
  .sbox input { flex: 1; border: 0; background: none; font: inherit; font-size: 16px; color: var(--ink); outline: none; min-width: 0; }
  .sbox .svgi { color: var(--muted); }

  /* detail */
  .gal { position: relative; margin: -14px -16px 0; }
  .gal-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .gal-track::-webkit-scrollbar { display: none; }
  .gal-slide { flex: none; width: 100%; scroll-snap-align: center; aspect-ratio: 1 / 1.05; max-height: 62vh; background: var(--tile); display: grid; place-items: center; color: var(--muted); }
  .gal-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gal-slide .svgi svg { width: 72px; height: 72px; opacity: .5; }
  .gal .tl { position: absolute; left: 16px; top: 14px; }
  .gal .tr { position: absolute; right: 16px; top: 14px; }
  .gal .dots { left: 50%; transform: translateX(-50%); bottom: 14px; }
  .gal .dots i { background: rgba(255,255,255,.6); box-shadow: 0 0 0 1px rgba(0,0,0,.12); }
  .gal .dots i.on { background: #fff; }
  .gal .cap { position: absolute; right: 16px; bottom: 12px; font-size: 11px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5); font-weight: 600; }
  .d-body { padding-top: 16px; }
  .d-title { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; margin: 0; }
  .d-price { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 10px 0 4px; }
  .d-price b { font-size: 30px; font-weight: 700; letter-spacing: -0.03em; }
  .d-price s { color: var(--muted); font-size: 16px; }
  .d-note { color: var(--muted); font-size: 14px; margin: 4px 0 0; font-weight: 500; }
  .blk { background: var(--card); border-radius: 20px; padding: 14px 16px; margin-top: 12px; }
  .blk h4 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
  .blk p { margin: 6px 0; font-size: 13.5px; color: var(--muted); font-weight: 500; }
  .code { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .code code { font-family: ui-monospace, Menlo, monospace; font-size: 16px; font-weight: 700; padding: 5px 12px; border-radius: 10px; border: 1.5px dashed var(--muted); }
  .ladder { display: grid; gap: 12px; }
  .lr { display: block; color: inherit; text-decoration: none; }
  .lr .line { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; font-weight: 500; }
  .lr .line b { font-weight: 700; }
  .lr .line em { font-style: normal; color: var(--muted); font-size: 12.5px; margin-left: 8px; }
  .bar { height: 7px; border-radius: 99px; background: var(--tile); margin-top: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 99px; background: var(--muted); opacity: .6; }
  .lr.you .bar i { background: var(--ink); opacity: 1; }
  .lr.you .line { font-weight: 700; }
  .cta { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--bar); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .cta .in { max-width: 640px; margin: 0 auto; display: flex; gap: 10px; }
  .cta .in .btn:first-child { flex: 1; }

  /* checkout */
  .panel { background: var(--card); border-radius: 22px; padding: 16px; margin-top: 12px; }
  .panel h3 { margin: 0 0 6px; font-size: 16px; font-weight: 600; }
  .panel textarea { width: 100%; font: inherit; font-size: 15px; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; resize: vertical; }
  .hint { color: var(--muted); font-size: 13px; margin: 8px 0; font-weight: 500; }
  .row2 { display: flex; gap: 8px; margin: 10px 0; }
  .empty { padding: 40px 18px; color: var(--muted); text-align: center; font-weight: 500; background: var(--card); border-radius: 22px; grid-column: 1 / -1; }
  .refresh { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; color: var(--muted); font-size: 13px; font-weight: 500; }
  .refresh button { background: none; border: 0; color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: underline; }

  /* filter button + sheet */
  .fab { position: fixed; right: 16px; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 20; width: 54px; height: 54px; border-radius: 50%; border: 0; background: var(--dark); color: var(--on-dark); display: none; place-items: center; box-shadow: 0 8px 22px rgba(0,0,0,.28); cursor: pointer; }
  .fab .svgi svg { width: 24px; height: 24px; }
  .sheet-bg { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.4); display: none; align-items: flex-end; }
  .sheet-bg.open { display: flex; }
  .sheet { width: 100%; max-width: 640px; margin: 0 auto; background: var(--card); border-radius: 26px 26px 0 0; padding: 18px 18px calc(22px + env(safe-area-inset-bottom, 0px)); }
  .sheet h3 { margin: 0 0 12px; font-size: 18px; font-weight: 600; }
  .seg { display: inline-flex; background: var(--tile); border-radius: 999px; padding: 3px; margin-bottom: 14px; }
  .seg button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px; font-weight: 600; padding: 8px 18px; border-radius: 999px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--dark); color: var(--on-dark); }
  .tgl { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--line); font-size: 15px; font-weight: 500; }
  .tgl button { width: 46px; height: 28px; border-radius: 99px; border: 0; background: var(--tile); position: relative; cursor: pointer; }
  .tgl button::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s; }
  .tgl button[aria-pressed="true"] { background: var(--ok-bg); }
  .tgl button[aria-pressed="true"]::after { transform: translateX(18px); }
  @media (prefers-reduced-motion: reduce) { .tgl button::after { transition: none; } }

  /* tab bar */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--bar); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px)); }
  .tabbar nav { display: flex; max-width: 640px; margin: 0 auto; }
  .tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: var(--muted); text-decoration: none; font-size: 11.5px; font-weight: 500; position: relative; }
  .tabbar a[aria-current="page"] { color: var(--ink); font-weight: 700; }
  .tabbar .bd { position: absolute; top: 0; left: calc(50% + 6px); background: var(--dark); color: var(--on-dark); font-size: 10px; font-weight: 700; min-width: 16px; height: 16px; border-radius: 99px; display: grid; place-items: center; padding: 0 4px; }
  body.no-tabs .tabbar { display: none; }
  body.no-tabs main { padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }

  .d-head { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; margin-top: 4px; }
  .drow { display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); font-size: 14px; align-items: center; }
  .drow .k { font-size: 13px; }
  .drow .v { font-weight: 500; text-align: right; }
  .pc-b .mt.style { color: var(--ink); font-weight: 600; }
  /* ===== Boutique look: editorial, ivory, serif ===== */
  :root[data-look="boutique"] {
    --bg: #fdfbf3; --tile: #e8e5dc; --card: #fdfbf3; --ink: #1b1b1a; --muted: #7f7d74; --line: #d8d5c9;
    --dark: #1b1b1a; --on-dark: #ffffff; --off-bg: #c8282b; --off-ink: #ffffff; --ok-bg: #1b1b1a; --ok-ink: #ffffff;
    --heart: #1b1b1a; --bar: rgba(253,251,243,.95); --accent: #c8282b;
    --display: "Instrument Serif", "Cormorant Garamond", Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-look="boutique"]:not([data-theme="light"]) {
      --bg: #151512; --tile: #26241f; --card: #151512; --ink: #f6f2e7; --muted: #a29f94; --line: #34322b;
      --dark: #f6f2e7; --on-dark: #151512; --off-bg: #e0534f; --ok-bg: #f6f2e7; --ok-ink: #151512;
      --heart: #f6f2e7; --bar: rgba(21,21,18,.95); --accent: #e0534f;
    }
  }
  :root[data-look="boutique"][data-theme="dark"] {
    --bg: #151512; --tile: #26241f; --card: #151512; --ink: #f6f2e7; --muted: #a29f94; --line: #34322b;
    --dark: #f6f2e7; --on-dark: #151512; --off-bg: #e0534f; --ok-bg: #f6f2e7; --ok-ink: #151512;
    --heart: #f6f2e7; --bar: rgba(21,21,18,.95); --accent: #e0534f;
  }
  :root[data-look="boutique"] .head .brand { font-family:var(--display);font-weight:400;font-size:32px;letter-spacing:-.01em }
  :root[data-look="boutique"] .ptitle { font-family:var(--display);font-weight:400;font-size:42px;letter-spacing:-.01em }
  :root[data-look="boutique"] .sh h3, :root[data-look="boutique"] .bg .nm, :root[data-look="boutique"] .blk h4, :root[data-look="boutique"] .panel h3, :root[data-look="boutique"] .sheet h3 { font-family:var(--display);font-weight:400 }
  :root[data-look="boutique"] .sh h3 { font-size:28px }
  :root[data-look="boutique"] .bg .nm { font-size:21px }
  :root[data-look="boutique"] .blk h4, :root[data-look="boutique"] .panel h3, :root[data-look="boutique"] .sheet h3 { font-size:21px }
  :root[data-look="boutique"] .pc, :root[data-look="boutique"] .pc-img, :root[data-look="boutique"] .bn, :root[data-look="boutique"] .btn, :root[data-look="boutique"] .pill, :root[data-look="boutique"] a.chip, :root[data-look="boutique"] a.bg, :root[data-look="boutique"] .bg .ci, :root[data-look="boutique"] .blk, :root[data-look="boutique"] .panel, :root[data-look="boutique"] .empty, :root[data-look="boutique"] .sheet, :root[data-look="boutique"] .panel textarea, :root[data-look="boutique"] .code code, :root[data-look="boutique"] .seg, :root[data-look="boutique"] .seg button, :root[data-look="boutique"] .sbox { border-radius:0 }
  :root[data-look="boutique"] .pc { background:none }
  :root[data-look="boutique"] .pc-img { aspect-ratio:1 / 1.1 }
  :root[data-look="boutique"] .pc-b { padding:8px 2px 14px }
  :root[data-look="boutique"] .pc-b .nm { font-family:var(--display);font-size:19px;font-weight:400;line-height:1.1;min-height:42px }
  :root[data-look="boutique"] .pc-b .pr { font-size:14px;font-weight:500;margin-top:5px }
  :root[data-look="boutique"] .pc-b .pr s { font-size:12px }
  :root[data-look="boutique"] .pc .heart { background:none;color:var(--ink);top:6px;right:6px }
  :root[data-look="boutique"] .circ { background:rgba(253,251,243,.78);box-shadow:none }
  :root[data-look="boutique"] .circ.on { color:var(--ink) }
  :root[data-look="boutique"] .pill { font-size:10.5px;padding:2px 7px;letter-spacing:.02em }

  /* ---------- router ---------- */
  function render() {
    var parts = (location.hash || "#/home").replace(/^#\//, "").split("/");
    var v = parts[0] || "home";
    app.textContent = ""; closeSheet();
    var tabFor = { home: "home", search: "", deals: "home", browse: "browse", g: "browse", saved: "saved", checkout: "checkout", deal: "" }[v];
    ["home", "browse", "saved", "checkout"].forEach(function (k) {
      var n = document.getElementById("t-" + k);
      if (k === (tabFor === undefined ? "home" : tabFor)) n.setAttribute("aria-current", "page"); else n.removeAttribute("aria-current");
    });
    document.body.classList.toggle("no-tabs", v === "deal");
    fab.style.display = (v === "deals" || v === "g") ? "grid" : "none";
    if (v === "g") viewGroup(parts[1], parts[2]);
    else if (v === "deals") viewDeals(parts[1]);
    else if (v === "browse") viewBrowse();
    else if (v === "search") viewSearch();
    else if (v === "saved") viewSaved();
    else if (v === "deal") viewDeal(parts[1]);
    else if (v === "checkout") viewCheckout();
    else viewHome();
    var cur = app.querySelector('a.chip[aria-current="true"]');
    if (cur && cur.scrollIntoView) { try { cur.scrollIntoView({ inline: "center", block: "nearest" }); } catch (e) {} }
  }
  var lastHash = "";
  window.addEventListener("hashchange", function () {
    var h = location.hash || "#/home";
    render(); if (h !== lastHash) window.scrollTo(0, 0); lastHash = h;
  });

  function load() {
    fetch("alerts.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) {
        j = j.filter(function (a) { return Date.now() / 1000 - a.ts < MAX_AGE_H * 3600; });
        data = j; data.forEach(function (a) { a._id = idOf(a); });
        var hot = j.filter(function (a) { return a.urgent && Date.now() / 1000 - a.ts < 86400; }).length;
        subText = hot ? hot + " urgent deal" + (hot === 1 ? "" : "s") + " today" : "Nothing urgent today";
        updatedText = "Updated " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
        updateBadge(); render();
      })
      .catch(function () {
        subText = "Couldn't load alerts.json. Serve this folder over http (see README).";
        updateBadge(); render();
      });
  }
  var styleData = null;
  function loadStyle() {
    fetch("style.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { styleData = j; })
      .catch(function () {});
  }
  function loadStats() {
    if (!window.fetch) return;
    fetch("top.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { scanStats = (j && j.stats) || null; if (scanStats) render(); })
      .catch(function () {});
  }
  updateBadge(); load(); loadStyle(); loadStats();
  if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js"); } catch (e) {} }
})();
